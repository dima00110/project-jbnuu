{% extends "base.html" %}

{% block title %}Вход — Регистратура{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4 col-sm-6">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <h4 class="card-title text-center mb-4">Вход в систему</h4>

        {% if form.errors %}
        <div class="alert alert-danger">Неверный логин или пароль.</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Логин</label>
            <input type="text" name="username" id="id_username"
                   class="form-control" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Пароль</label>
            <input type="password" name="password" id="id_password"
                   class="form-control" required>
          </div>
          <button class="btn btn-primary w-100">Войти</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
